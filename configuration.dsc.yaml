# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
#
# ============================================================================
#  Windows Dev Setup  -  winget Configuration (DSC)
# ============================================================================
#  Declarative file: describes the DESIRED STATE of the machine.
#  Replicate everything with:  winget configure -f configuration.dsc.yaml
#  (or simply run .\bootstrap.ps1)
#
#  How to customize:
#    - Add one block per program inside "resources:".
#    - Uncomment (remove the "# ") the items in the SUGGESTIONS section you want.
#    - Find any package id with:  winget search "<name>"
# ============================================================================

properties:
  configurationVersion: 0.2.0

  # --- Machine prerequisites ----------------------------------------------
  assertions:
    - resource: Microsoft.Windows.Developer/OsVersion
      id: osVersion
      directives:
        description: Requires Windows 11 (build 22000) or newer
        allowPrerelease: true
      settings:
        MinVersion: '10.0.22000'

  # --- Programs to install ------------------------------------------------
  resources:

    # ======================= CORE (already on your machine) =================

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Git - version control
        allowPrerelease: true
      settings:
        id: Git.Git
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: windowsTerminal
      directives:
        description: Windows Terminal
        allowPrerelease: true
      settings:
        id: Microsoft.WindowsTerminal
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: neovim
      directives:
        description: Neovim - editor
        allowPrerelease: true
      settings:
        id: Neovim.Neovim
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnetRuntime9
      directives:
        description: .NET Desktop Runtime 9
        allowPrerelease: true
      settings:
        id: Microsoft.DotNet.DesktopRuntime.9
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: claude
      directives:
        description: Claude (Anthropic)
        allowPrerelease: true
      settings:
        id: Anthropic.Claude
        source: winget

